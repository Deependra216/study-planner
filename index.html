<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Plan your studies, track tasks, and take notes in one place." />
  <title>Study Planner</title>
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
  <header>
    <a href="index.html">Study Planner</a>
    <nav aria-label="Main navigation">
      <ul>
        <li><a href="#features">Features</a></li>
        <li><a href="dashboard.html">Dashboard</a></li>
        <li><a href="#signup">Sign up</a></li>
      </ul>
      <button id="theme-toggle" type="button" aria-label="Toggle dark mode">🌙</button>
    </nav>
  </header>

  <main class="auth-page">
    <section id="hero">
      <h1>Plan smarter. Study better.</h1>
      <p>One place for your tasks, notes, and progress.</p>
      <a href="#signup">Get started</a>
    </section>

    <section id="features">
      <h2>Features </h2>
      <article>
        <h3>Task board</h3>
        <p>Move tasks from To Do to Done.</p>
      </article>
      <!-- add 2 more articles: Notes, Progress charts -->
    </section>

    <section id="signup">
      <h2>Create your account </h2>
      <form class="signup-form" action="#" method="post">


    <div class="form-group">
      <label for="name">Full name</label>
      <input type="text" id="name" name="name" required />
    </div>

    <div class="form-group">
      <label for="email">Email</label>
      <input type="email" id="email" name="email" required />
    </div>

    <div class="form-group">
      <label for="password">Password</label>
      <input type="password" id="password" name="password" minlength="8" required />
    </div>

    <button type="submit" class="btn">Sign up</button>
    <p class="form-footer">Already have an account? <a href="login.html">Log in</a></p>
  </form>
    </section>
  </main>

  <footer class="form-footer">
    <p>&copy; 2026 Study Planner</p>
  </footer>
</body>

<script src="js/script.js"></script>
</html>
